<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OutilPro — Recherche intelligente (concept démo)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #F5F6F7;
    --surface: #FFFFFF;
    --line: #E3E6EA;
    --navy: #16324F;
    --navy2: #1F4368;
    --ink: #1B2430;
    --muted: #66707F;
    --accent: #F2542D;
    --accent-soft: #FDE7E1;
    --ok: #1B998B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ---------- Bandeau contexte démo ---------- */
  .demo-flag {
    background: var(--navy);
    color: #fff;
    text-align: center;
    font-size: 0.75rem;
    padding: 6px 12px;
    letter-spacing: 0.02em;
  }
  .demo-flag strong { color: #FFD59E; }

  /* ---------- Nav boutique fictive ---------- */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--navy);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand span { color: var(--accent); }
  .nav-links {
    display: flex;
    gap: 1.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 500;
  }
  @media (max-width: 720px) { .nav-links { display: none; } }

  /* ---------- Zone de recherche ---------- */
  .search-zone {
    max-width: 760px;
    margin: 2.5rem auto 0.5rem;
    padding: 0 1.5rem;
    position: relative;
  }
  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .search-box.ai-active {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .search-icon {
    padding: 0 12px;
    font-size: 1.1rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  #searchInput {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 12px 4px;
    background: transparent;
    color: var(--ink);
  }
  #searchInput::placeholder { color: #9AA3B0; }
  .ai-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    padding: 6px 11px;
    border-radius: 9px;
    margin-right: 4px;
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .ai-badge.pulsing { background: var(--accent); }
  .ai-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #6EE7D8; flex-shrink: 0;
    animation: dotpulse 1.6s infinite ease-in-out;
  }
  .ai-badge.pulsing .ai-dot { background: #FFD59E; }
  @keyframes dotpulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .search-hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 10px 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .search-hint b { color: var(--navy); font-weight: 600; }
  .search-examples {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px 4px 0;
  }
  .example-chip {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--navy2);
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .example-chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Zone de résultats ---------- */
  .results-zone {
    max-width: 1000px;
    margin: 2.5rem auto 4rem;
    padding: 0 1.5rem;
  }
  .results-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 1.1rem;
  }
  .results-heading h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
  }
  .results-heading .count {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .ai-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 7px;
  }

  /* ---------- Dropdown de résultats (autocomplete réel, pas une page de résultats) ---------- */
  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 1.5rem;
    right: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(20, 30, 45, 0.14);
    max-height: 420px;
    overflow-y: auto;
    z-index: 20;
  }
  .search-dropdown.open { display: block; }
  .dropdown-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .dropdown-heading .ai-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .result-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid #F1F2F4;
    transition: background 0.12s ease;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row:hover { background: #FAFBFC; }
  .result-thumb {
    width: 40px;
    height: 40px;
    object-fit: contain;
    background: #FAFBFC;
    border: 1px solid var(--line);
    border-radius: 8px;
    flex-shrink: 0;
    padding: 3px;
  }
  .result-thumb-placeholder {
    width: 40px;
    height: 40px;
    background: #EEF0F2;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--navy);
    margin-top: 1px;
  }
  .result-arrow {
    color: var(--accent);
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .dropdown-empty, .dropdown-loading, .dropdown-text {
    padding: 16px 14px;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }
  .dropdown-text { text-align: left; line-height: 1.5; color: var(--ink); }
  .dropdown-loading .dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin: 0 2px;
    animation: dotpulse 1s infinite ease-in-out;
  }
  .dropdown-loading .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dropdown-loading .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotpulse { 0%,100% { opacity:0.4; transform:scale(0.85);} 50% {opacity:1; transform:scale(1.1);} }
</style>
</head>
<body>

<div class="demo-flag">Concept démo — <strong>Barre de recherche intelligente</strong> · aucune bulle de chat, juste une recherche qui devient magique</div>

<nav>
  <div class="brand">OUTIL<span>PRO</span></div>
  <div class="nav-links">
    <span>Électroportatif</span>
    <span>Quincaillerie</span>
    <span>Jardin</span>
    <span>Protection</span>
  </div>
</nav>

<div class="search-zone">
  <div class="search-box" id="searchBox">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Rechercher un produit..." onkeydown="if(event.key==='Enter') runSearch()" oninput="onTyping()" />
    <span class="ai-badge" id="aiBadge"><span class="ai-dot"></span>IA</span>
  </div>
  <div class="search-hint">✨ <b>Nouveau</b> — posez une question en langage naturel, ex. "un frigo pas cher pour un studio"</div>
  <div class="search-examples">
    <button class="example-chip" onclick="runSearch('un frigo pas cher pour un studio')">un frigo pas cher pour un studio</button>
    <button class="example-chip" onclick="runSearch('television samsung')">television samsung</button>
    <button class="example-chip" onclick="runSearch('pc portable moins de 800 euros')">pc portable moins de 800€</button>
  </div>

  <div class="search-dropdown" id="dropdown"></div>
</div>

<script>
const API_URL = 'https://maorediscount-api.vercel.app/api/chat';
let history = [];
let typingTimer = null;

function onTyping() {
  const badge = document.getElementById('aiBadge');
  const box = document.getElementById('searchBox');
  const val = document.getElementById('searchInput').value.trim();
  const looksLikeSentence = val.split(' ').length >= 3;
  badge.classList.toggle('pulsing', looksLikeSentence);
  box.classList.toggle('ai-active', looksLikeSentence);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function runSearch(presetQuery) {
  const input = document.getElementById('searchInput');
  const query = (presetQuery !== undefined ? presetQuery : input.value).trim();
  if (!query) return;
  input.value = query;
  onTyping();

  const dropdown = document.getElementById('dropdown');
  dropdown.classList.add('open');
  dropdown.innerHTML = `<div class="dropdown-loading">Analyse de votre demande <span class="dots"><span></span><span></span><span></span></span></div>`;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: query, history }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    history = data.history || history;
    renderResults(data.reply || '', query);
  } catch (e) {
    dropdown.innerHTML = `<div class="dropdown-empty">Une erreur est survenue, réessayez dans un instant.</div>`;
    console.error('Search demo error:', e);
  }
}

function renderResults(text, query) {
  const dropdown = document.getElementById('dropdown');

  if (!text.includes('🛒')) {
    // Réponse texte (infos pratiques) plutôt qu'une liste de produits.
    dropdown.innerHTML = `
      <div class="dropdown-heading">Réponse pour "${escapeHtml(query)}" <span class="ai-tag">✨ IA</span></div>
      <div class="dropdown-text">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
    `;
    return;
  }

  const [introRaw, ...rest] = text.split('🛒');
  const blocks = rest.map(b => b.trim()).filter(Boolean);

  if (blocks.length === 0) {
    dropdown.innerHTML = `<div class="dropdown-empty">Aucun produit trouvé pour cette recherche.</div>`;
    return;
  }

  const rows = blocks.map(block => {
    const nameMatch = block.match(/\*\*(.+?)\*\*\s*—\s*([\d.,]+)\s*€/);
    const imgMatch = block.match(/!\[image\]\((.+?)\)/);
    const urlMatch = block.match(/👉\s*(https?:\/\/\S+)/);
    const nom = nameMatch ? nameMatch[1].trim() : 'Produit';
    const prix = nameMatch ? `${nameMatch[2]} €` : '';
    const image_url = imgMatch ? imgMatch[1].trim() : '';
    const url = urlMatch ? urlMatch[1].trim() : '#';
    return `
      <a href="${url}" target="_blank" class="result-row">
        ${image_url
          ? `<img class="result-thumb" src="${image_url}" alt="${escapeHtml(nom)}" onerror="this.outerHTML='<div class=&quot;result-thumb-placeholder&quot;></div>'">`
          : '<div class="result-thumb-placeholder"></div>'}
        <div class="result-info">
          <div class="result-name">${escapeHtml(nom)}</div>
          <div class="result-price">${escapeHtml(prix)}</div>
        </div>
        <span class="result-arrow">→</span>
      </a>
    `;
  }).join('');

  dropdown.innerHTML = `
    <div class="dropdown-heading">${blocks.length} résultat${blocks.length > 1 ? 's' : ''} pour "${escapeHtml(query)}" <span class="ai-tag">✨ Recherche IA</span></div>
    ${rows}
  `;
}

// Ferme le dropdown si on clique en dehors de la zone de recherche.
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-zone')) {
    document.getElementById('dropdown').classList.remove('open');
  }
});
</script>
</body>
</html>
